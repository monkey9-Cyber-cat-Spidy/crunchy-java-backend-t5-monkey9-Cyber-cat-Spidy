spring.application.name=bookstore-secure-api
server.port=${PORT:${SERVER_PORT:8080}}

# Database Configuration (MySQL 8)
# Supports JDBC URL directly via SPRING_DATASOURCE_URL or composed DB_* variables
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:crunchy_bookstore}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USER:root}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
# Managed strictly by Flyway; ddl-auto=update is strictly prohibited
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=WARN

# Flyway Database Migrations (Auto-selects postgresql or mysql based on active database)
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=${FLYWAY_LOCATIONS:classpath:db/migration/{vendor}}

# JWT Security Properties (Injected securely from runtime environment)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Cloud Health & Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# OpenAPI 3 / Swagger Documentation
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# Security & Error Response Guardrails (Zero internal leakage to clients)
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
