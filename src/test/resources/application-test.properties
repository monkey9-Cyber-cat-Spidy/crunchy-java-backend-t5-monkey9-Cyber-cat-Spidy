spring.application.name=bookstore-secure-api-test

# Test In-Memory Database (H2 with MySQL mode)
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA and Flyway for tests
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/mysql
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Test JWT configuration with finite expiration
app.jwt.secret=test_jwt_secret_key_needs_to_be_at_least_256_bits_long_crunchy_code_test_only
app.jwt.expiration-ms=3600000

# Cloud Health & Actuator
management.endpoints.web.exposure.include=health,info

server.error.include-message=never
server.error.include-stacktrace=never
